name: Daily GitHub Engineering Report

on:
  schedule:
    # 3:30 AM UTC is 9:00 AM IST (Monday to Friday)
    - cron: '30 3 * * 1-5'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to run (daily)'
        required: true
        default: 'daily'

jobs:
  run-daily-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Daily Report Generator
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.GITHUB_ORG_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          DAILY_RECEIVERS: ${{ secrets.DAILY_RECEIVERS }}
        run: |
          python main.py --type daily
