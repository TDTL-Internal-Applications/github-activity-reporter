name: Weekly GitHub Engineering Report

on:
  schedule:
    # 4:30 AM UTC is 10:00 AM IST (Every Monday)
    - cron: '30 4 * * 1'
  workflow_dispatch:
    inputs:
      report_type:
        description: 'Type of report to run (weekly)'
        required: true
        default: 'weekly'

jobs:
  run-weekly-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Weekly Report Generator
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
          GITHUB_ORG_NAME: ${{ secrets.GITHUB_ORG_NAME }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          WEEKLY_RECEIVERS: ${{ secrets.WEEKLY_RECEIVERS }}
        run: |
          python main.py --type weekly
